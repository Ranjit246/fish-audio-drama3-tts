# Step 5b: (c) + room for the forced-aligner stage (stage 0 KV budget 0.78 -> 0.70;
# still ~26 GiB of KV, far more than 32 streams need).
base_config: /PATH/TO/site-packages/vllm_omni/deploy/fish_omni.yaml
connectors:
  connector_of_shared_memory:
    extra:
      codec_chunk_ramp: "2,4,8,16,32"
      ar_prefill_admission_min_batch: 0
      ar_prefill_admission_max_wait_ms: 0
      ar_prefill_admission_min_running: 0
stages:
  - stage_id: 0
    max_num_seqs: 32
    gpu_memory_utilization: 0.70
    hf_overrides:
      fish_omni_max_top_k: 128
  - stage_id: 1
    max_num_seqs: 32

# Tuning step (c): (b) + allow main-token top_k above the fused sampler's
# default cap of 64, so requests can ask for top_k 100 (bench.py --top-k 100).
base_config: /PATH/TO/site-packages/vllm_omni/deploy/fish_omni.yaml
connectors:
  connector_of_shared_memory:
    extra:
      codec_chunk_ramp: "2,4,8,16,32"
      ar_prefill_admission_min_batch: 0
      ar_prefill_admission_max_wait_ms: 0
      ar_prefill_admission_min_running: 0
stages:
  - stage_id: 0
    max_num_seqs: 32
    hf_overrides:
      fish_omni_max_top_k: 128
  - stage_id: 1
    max_num_seqs: 32
